name: hirfati
description: "app for hirfati , Develpoed through Mohamed Saleh"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.2.1
  reactive_forms: ^18.2.2
  go_router: ^17.1.0
  flutter_native_splash: ^2.4.7
  flutter_svg: ^2.2.3
  icons_launcher: ^3.0.3
  i18n_extension: ^15.1.0
  i18n_extension_importer: ^0.0.6
  freezed_annotation: ^3.1.0
  json_annotation: ^4.10.0
  flex_color_scheme: ^8.4.0
  supabase_flutter: ^2.12.0
  lottie: ^3.3.2
  flutter_dotenv: ^6.0.0
  google_maps_flutter: ^2.6.0
  location: ^7.0.1
  permission_handler: ^12.0.1
  image_picker: ^1.0.7
  google_maps_flutter_web: ^0.6.2
  shared_preferences: ^2.5.4
  flutter_image_compress: ^2.3.0
  http: ^1.6.0
  flutter_local_notifications: ^21.0.0
  firebase_messaging: ^16.1.3
  firebase_core: ^4.11.0
  url_launcher: ^6.3.2
  flutter_chat_ui: any
  flutter_chat_types: any
  flutter_rating_bar: ^4.0.1
  pdf: ^3.10.7
  pinput: ^6.0.2
  # printing: ^5.14.3
  # share_plus: ^12.0.2
  # share_plus: ^6.3.4
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.11.1
  freezed: ^3.2.5
  json_serializable: ^6.12.0

icons_launcher:
  image_path: "assets/images/Logo_app.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true

flutter_native_splash:
  color: "#EEF4FB"
  image: "assets/images/Logo_splash.png"

  android_12:
    image: "assets/images/Logo_splash.png"
    color: "#EEF4FB"
  android: true
  ios: true

  web: false

  fullscreen: true

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/animations/
    - assets/fonts/
    - assets/translations/ar.json
    - assets/svgs/
    - assets/no_data.json
    - .env

  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
apply plugin: "com.google.gms.google-services"
